name: HAMIYA Signed Android Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'playwright.config.ts'
      - 'native/**'
      - 'public/**'
      - 'index.html'
      - 'app.html'
      - 'vite.config.ts'
      - 'scripts/package-updates.mjs'
      - 'scripts/package-android-release.mjs'
      - 'scripts/prepare-native-web.mjs'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/configure-android.mjs'
      - 'scripts/verify-android-signature.mjs'
      - 'scripts/check-installed-android-window.sh'
      - 'scripts/verify-android-window.py'
      - 'scripts/build-android-update-tests.sh'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Run application checks
        run: pnpm lint && pnpm test && pnpm typecheck

      - name: Build production web assets
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_HAMIYA_UPDATE_PUBLIC_KEY: ${{ vars.VITE_HAMIYA_UPDATE_PUBLIC_KEY }}
        run: |
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || {
            echo "Missing Supabase publishable key"
            exit 1
          }
          pnpm build
          node -e "require('fs').rmSync('dist/updates', { recursive: true, force: true })"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify production customer and administrator screens before signing
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:browser
        env:
          PLAYWRIGHT_PRODUCTION: '1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Generate Android native project
        run: |
          node scripts/prepare-native-web.mjs
          pnpm exec cap add android
          pnpm exec cap sync android
          node scripts/configure-android.mjs

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.HAMIYA_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HAMIYA_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HAMIYA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HAMIYA_ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!name}" || {
              echo "Missing signing secret: $name"
              exit 1
            }
          done

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/hamiya-release.jks

          test -s android/app/hamiya-release.jks || {
            echo "Keystore decoding failed"
            exit 1
          }

          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  hamiyaRelease {
                      storeFile file('hamiya-release.jks')
                      storePassword System.getenv('HAMIYA_ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('HAMIYA_ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('HAMIYA_ANDROID_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.hamiyaRelease
                  }
              }
          }
          GRADLE

      - name: Build signed release APK and AAB
        working-directory: android
        env:
          HAMIYA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HAMIYA_ANDROID_KEYSTORE_PASSWORD }}
          HAMIYA_ANDROID_KEY_ALIAS: ${{ secrets.HAMIYA_ANDROID_KEY_ALIAS }}
          HAMIYA_ANDROID_KEY_PASSWORD: ${{ secrets.HAMIYA_ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify APK and AAB signatures
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          AAB="$(find android/app/build/outputs/bundle/release -name '*.aab' -print -quit)"

          test -s "$APK" && test -s "$AAB"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/hamiya-signature.txt"
          node scripts/verify-android-signature.mjs "$RUNNER_TEMP/hamiya-signature.txt"
          jarsigner -verify "$AAB"
          AAPT="$(dirname "$APKSIGNER")/aapt"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/hamiya-apk-info.txt"
          grep -F "package: name='com.hamiyainvestmentgroup.customer'" "$RUNNER_TEMP/hamiya-apk-info.txt"

      - name: Build native update security and installer tests
        env:
          HAMIYA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HAMIYA_ANDROID_KEYSTORE_PASSWORD }}
          HAMIYA_ANDROID_KEY_ALIAS: ${{ secrets.HAMIYA_ANDROID_KEY_ALIAS }}
          HAMIYA_ANDROID_KEY_PASSWORD: ${{ secrets.HAMIYA_ANDROID_KEY_PASSWORD }}
        run: bash scripts/build-android-update-tests.sh

      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HAMIYA-signed-android-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error

      - name: Enable Android emulator acceleration
        run: |
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm

      - name: Check the signed APK on Android 15 before publication
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/check-installed-android-window.sh android/app/build/outputs/apk/release/app-release.apk

      - name: Check the signed APK on Android 16 before publication
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/check-installed-android-window.sh android/app/build/outputs/apk/release/app-release.apk

      - name: Save Android runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HAMIYA-native-window-evidence
          path: android-window-results/
          if-no-files-found: warn

      - name: Publish Android update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp android/app/build/outputs/apk/release/*.apk release/Hamiya.apk
          cp android/app/build/outputs/bundle/release/*.aab release/Hamiya.aab
          node scripts/package-android-release.mjs
          cd release
          sha256sum Hamiya.apk Hamiya.aab > SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          Hamiya Android with updates inside App settings → App updates.

          Tap Update app to download and verify the signed release inside HAMIYA. Android asks you to approve installation; no browser or external download page is opened. Updates preserve your data and existing signing identity. Compatible signed web releases also support Update & restart.
          NOTES
          tag="android-build-${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" Hamiya.apk Hamiya.aab SHA256SUMS.txt android-release.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" Hamiya.apk Hamiya.aab SHA256SUMS.txt android-release.json --target "$GITHUB_SHA" --title "Hamiya Android — build ${GITHUB_RUN_NUMBER}" --notes-file release-notes.md --latest --repo "$GITHUB_REPOSITORY"
          fi

      - name: Verify production APK download
        run: node scripts/verify-android-download.mjs release/Hamiya.apk
