name: HAMIYA Signed Android Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'scripts/package-updates.mjs'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/configure-android.mjs'
      - 'scripts/verify-android-signature.mjs'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Run application checks
        run: pnpm lint && pnpm test && pnpm typecheck

      - name: Build production web assets
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_HAMIYA_UPDATE_PUBLIC_KEY: ${{ vars.VITE_HAMIYA_UPDATE_PUBLIC_KEY }}
        run: |
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || {
            echo "Missing Supabase publishable key"
            exit 1
          }
          pnpm build
          node -e "require('fs').rmSync('dist/updates', { recursive: true, force: true })"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Generate Android native project
        run: |
          pnpm exec cap add android
          pnpm exec cap sync android
          node scripts/configure-android.mjs

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.HAMIYA_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HAMIYA_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HAMIYA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HAMIYA_ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!name}" || {
              echo "Missing signing secret: $name"
              exit 1
            }
          done

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/hamiya-release.jks

          test -s android/app/hamiya-release.jks || {
            echo "Keystore decoding failed"
            exit 1
          }

          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  hamiyaRelease {
                      storeFile file('hamiya-release.jks')
                      storePassword System.getenv('HAMIYA_ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('HAMIYA_ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('HAMIYA_ANDROID_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.hamiyaRelease
                  }
              }
          }
          GRADLE

      - name: Build signed release APK and AAB
        working-directory: android
        env:
          HAMIYA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HAMIYA_ANDROID_KEYSTORE_PASSWORD }}
          HAMIYA_ANDROID_KEY_ALIAS: ${{ secrets.HAMIYA_ANDROID_KEY_ALIAS }}
          HAMIYA_ANDROID_KEY_PASSWORD: ${{ secrets.HAMIYA_ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify APK and AAB signatures
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          AAB="$(find android/app/build/outputs/bundle/release -name '*.aab' -print -quit)"

          test -s "$APK" && test -s "$AAB"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/hamiya-signature.txt"
          node scripts/verify-android-signature.mjs "$RUNNER_TEMP/hamiya-signature.txt"
          jarsigner -verify "$AAB"
          AAPT="$(dirname "$APKSIGNER")/aapt"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/hamiya-apk-info.txt"
          grep -F "package: name='com.hamiyainvestmentgroup.customer'" "$RUNNER_TEMP/hamiya-apk-info.txt"

      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HAMIYA-signed-android-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error

      - name: Publish Android update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp android/app/build/outputs/apk/release/*.apk release/Hamiya.apk
          cp android/app/build/outputs/bundle/release/*.aab release/Hamiya.aab
          cd release
          sha256sum Hamiya.apk Hamiya.aab > SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          Hamiya Android with App settings → App updates.

          Compatible web releases can be installed in-app only when signed with the configured HAMIYA update key. Native Android upgrades install over this app and preserve its data. Keep the same signing identity for future releases.
          NOTES
          tag="android-build-${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" Hamiya.apk Hamiya.aab SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" Hamiya.apk Hamiya.aab SHA256SUMS.txt --target "$GITHUB_SHA" --title "Hamiya Android — build ${GITHUB_RUN_NUMBER}" --notes-file release-notes.md --latest --repo "$GITHUB_REPOSITORY"
          fi
